<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#2a1a08"/>
      <stop offset="100%" stop-color="#160e04"/>
    </radialGradient>
    <linearGradient id="hex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="hive" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe9ae"/>
      <stop offset="100%" stop-color="#c2760b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- honeycomb frame -->
  <polygon points="256,30 452,142 452,370 256,482 60,370 60,142"
           fill="none" stroke="url(#hex)" stroke-width="14" stroke-linejoin="round"/>
  <polygon points="256,30 452,142 452,370 256,482 60,370 60,142"
           fill="none" stroke="#ffe8a8" stroke-width="2" stroke-linejoin="round" opacity="0.5"/>

  <!-- glow behind the hive -->
  <circle cx="256" cy="300" r="150" fill="url(#glow)"/>

  <!-- classic beehive dome (skep), built from tapering woven bands -->
  <g>
    <path d="M 256 190
             C 310 190 334 232 334 260
             L 334 320
             C 334 348 300 364 256 364
             C 212 364 178 348 178 320
             L 178 260
             C 178 232 202 190 256 190 Z"
          fill="url(#hive)" stroke="#8a5308" stroke-width="3"/>
    <!-- woven band lines -->
    <path d="M 180 232 Q 256 252 332 232" fill="none" stroke="#8a5308" stroke-width="3.5" opacity="0.55"/>
    <path d="M 178 272 Q 256 294 334 272" fill="none" stroke="#8a5308" stroke-width="3.5" opacity="0.55"/>
    <path d="M 178 312 Q 256 334 334 312" fill="none" stroke="#8a5308" stroke-width="3.5" opacity="0.55"/>
    <path d="M 183 346 Q 256 362 329 346" fill="none" stroke="#8a5308" stroke-width="3.5" opacity="0.45"/>
    <!-- entrance hole -->
    <ellipse cx="256" cy="350" rx="20" ry="13" fill="#3a2410"/>
    <!-- highlight -->
    <path d="M 215 206 C 198 222 188 244 186 262" fill="none" stroke="#fff6df" stroke-width="7" stroke-linecap="round" opacity="0.55"/>
  </g>

  <!-- bee -->
  <g transform="translate(256,138)">
    <!-- wings -->
    <ellipse cx="-26" cy="-6" rx="24" ry="15" fill="#fff7e6" opacity="0.88" transform="rotate(-18 -26 -6)"/>
    <ellipse cx="26" cy="-6" rx="24" ry="15" fill="#fff7e6" opacity="0.88" transform="rotate(18 26 -6)"/>
    <!-- body -->
    <ellipse cx="0" cy="8" rx="22" ry="17" fill="#2a1a08"/>
    <rect x="-22" y="-2" width="44" height="7" fill="#fcd34d"/>
    <rect x="-22" y="12" width="44" height="7" fill="#fcd34d"/>
    <!-- head -->
    <circle cx="0" cy="-16" r="11" fill="#2a1a08"/>
    <circle cx="-4" cy="-18" r="2" fill="#fff7e6"/>
    <circle cx="4" cy="-18" r="2" fill="#fff7e6"/>
    <!-- antennae -->
    <path d="M -5 -26 Q -12 -34 -16 -30" stroke="#2a1a08" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 5 -26 Q 12 -34 16 -30" stroke="#2a1a08" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
</svg>
